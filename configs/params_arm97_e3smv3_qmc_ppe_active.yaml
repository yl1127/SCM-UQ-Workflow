    baseline: 7.0
    lower: 3.0
    upper: 7.5
    format: D0
    note: Autoconversion enhancement factor in ZM microphysics; v3-only professor table parameter.
  - name: zmconv_accr_fac
    short_name: zm_accr_fac
    baseline: 1.5
    lower: 1.5
    upper: 2.0
    format: D0
    note: Accretion enhancement factor in ZM microphysics; v3-only professor table parameter.
  - name: zmconv_micro_dcs
    short_name: zm_micro_dcs
    baseline: 0.00015
    lower: 0.0001
    upper: 0.0004
    format: e
    note: Autoconversion size threshold for cloud ice; 100-400 um range converted to meters.
