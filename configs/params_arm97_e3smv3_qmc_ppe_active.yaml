  - name: p3_autocon_coeff
    short_name: autocon_coeff
    baseline: 30500.0
    lower: 1350.0
    upper: 30500.0
    format: D0
    note: Autoconversion coefficient; two professor-table values treated as a continuous min/max range.
  - name: p3_qc_autocon_expon
    short_name: qc_autocon_expon
    baseline: 3.19
    lower: 2.47
    upper: 3.2
    format: D0
    note: Autoconversion qc exponent; v3 default from atm_in_full.
  - name: p3_nc_autocon_expon
    short_name: nc_autocon_expon
    baseline: -1.10
    lower: -1.79
    upper: -1.4
    format: D0
    note: Autoconversion nc exponent; two professor-table values treated as a continuous min/max range.
  - name: p3_accret_coeff
    short_name: accret_coeff
    baseline: 117.25
    lower: 67.0
    upper: 117.25
    format: D0
    note: Accretion coefficient; two professor-table values treated as a continuous min/max range.
  - name: p3_qc_accret_expon
    short_name: qc_accret_expon
    baseline: 1.15
    lower: 1.0
