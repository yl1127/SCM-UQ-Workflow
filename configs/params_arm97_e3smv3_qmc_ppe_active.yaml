description: Active 27-parameter ARM97 E3SMv3 QMC set for the stitched 64-member experiment.
derived_from: configs/params_arm97_e3smv3_qmc_ppe.yaml
sources:
  - /Users/yunlong/Documents/yl-groupmeeting-0529/tuning-parameters-from-PPE-paper.docx
  - /Users/yunlong/Downloads/Tuning+parameters+in+ZM+and+P3.doc
unit_policy: Length parameters from the professor table are converted to E3SM namelist SI units (meters).
baseline_policy: Baseline values match the current Mac ARM97 template and are retained as metadata; Demo 5 generates QMC samples only.
excluded_parameters:
  - name: zmconv_c0_lnd
    reason: Legacy or insensitive parameter excluded after the July 9 hybrid modeling meeting.
  - name: zmconv_c0_ocn
    reason: Legacy or insensitive parameter excluded after the July 9 hybrid modeling meeting.
  - name: ice_sed_ai
    reason: Legacy or inactive cloud-ice sedimentation parameter excluded after the July 9 hybrid modeling meeting.
  - name: cloud_reffi_zmdetr
    reason: Excluded after the July 9 meeting; not present in the runnable source YAML, ARM97 template, or local E3SM namelist.
parameters:
  - name: cldfrc_dp1
    short_name: dp1
    baseline: 0.018
    lower: 0.02
    upper: 0.1
    format: D0
    note: Deep convection cloud fraction parameter; clubb_intr; Ma.
  - name: zmconv_dmpdz
    short_name: dmpdz
    baseline: -0.0007
    lower: -0.002
    upper: -0.0001
    format: e
    note: Parcel fractional mass entrainment rate; zm_conv; Qian15/Neale.
  - name: zmconv_ke
    short_name: ke
    baseline: 0.0000025
    lower: 0.0000005
    upper: 0.00001
    format: E
    note: Evaporation efficiency of precipitation; zm_conv; Qian15.
  - name: zmconv_alfa
    short_name: alfa
    baseline: 0.14
    lower: 0.05
    upper: 0.60
    format: D0
    note: Maximum cloud downdraft mass flux fraction; zm_conv; Qian15.
  - name: zmconv_tau
    short_name: tau
    baseline: 3600.0
    lower: 1800.0
    upper: 14400.0
    format: float
    note: Time scale for consumption rate deep CAPE; zm_conv; Qian15/Neale.
  - name: cldfrc2m_rhmaxi
    short_name: rhmaxi
    baseline: 1.05
    lower: 1.0
    upper: 1.1
    format: D0
    note: Max relative humidity threshold for ice cloud; cldfrc2m; Ma/Zhang.
  - name: clubb_gamma_coef
    short_name: gamma_coef
    baseline: 0.12
    lower: 0.1
    upper: 0.5
    format: float
    note: Constant of the width of PDF in w coordinate; parameters_tunable; Guo15/Ma.
  - name: clubb_C8
    short_name: c8
    baseline: 5.2
    lower: 2.0
    upper: 8.0
    format: float
    note: Constant associated with Newtonian damping; parameters_tunable; Guo15/Ma.
  - name: clubb_beta
    short_name: beta
    baseline: 2.4
    lower: 1.0
    upper: 3.0
    format: float
    note: Constant related to skewness of theta_l and qt; parameters_tunable; Ma.
  - name: clubb_C2rt
    short_name: c2rt
    baseline: 1.75
    lower: 0.5
    upper: 2.0
    format: D0
    note: Constant with dissipation of variance of total water; parameters_tunable; Guo15/Ma.
  - name: clubb_c_K10
    short_name: c_k10
    baseline: 0.35
    lower: 0.3
    upper: 1.2
    format: float
    note: Momentum diffusion factor; parameters_tunable; Ma.
  - name: clubb_C1
    short_name: c1
    baseline: 2.4
    lower: 1.0
    upper: 5.0
    format: float
    note: Constant associated with dissipation of variance; parameters_tunable; Ma.
  - name: clubb_C6rt
    short_name: c6rt
    baseline: 4.0
    lower: 3.0
    upper: 8.0
    format: float
    note: Low skewness of Newtonian damping of water flux; parameters_tunable; Qian.
  - name: effgw_oro
    short_name: effgw_oro
    baseline: 0.375
    lower: 0.1
    upper: 0.4
    format: float
    note: Gravity wave drag intensity; gw_drag; Ma.
  - name: nucleate_ice_subgrid
    short_name: ice_subgrid
    baseline: 1.35
    lower: 1.0
    upper: 1.3
    format: D0
    note: Subgrid RH factor for ice nucleation; v3 default from atm_in_full, perturbation range from professor table.
  - name: so4_sz_thresh_icenuc
    short_name: so4_ice
    baseline: 0.00000008
    lower: 0.00000005
    upper: 0.0000001
    format: e
    note: Sulfate aerosol size threshold for ice nucleation; 50-100 nm range converted to meters, baseline 80 nm.
  - name: p3_wbf_coeff
    short_name: wbf
    baseline: 1.0
    lower: 0.1
    upper: 1.0
    format: float
    note: WBF coefficient; v3-only P3 microphysics parameter.
  - name: p3_max_mean_rain_size
    short_name: max_rain_size
    baseline: 0.005
    lower: 0.0002
    upper: 0.005
    format: D
